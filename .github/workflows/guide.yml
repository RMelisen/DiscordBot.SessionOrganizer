# Builds the members' user guide (guide/ + mkdocs.yml) and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish user guide

on:
  push:
    branches: [main]
    paths:
      - 'guide/**'
      - 'mkdocs.yml'
      - '.github/workflows/guide.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the latest guide matters: a newer push supersedes a deploy still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commits, not tags: a tag can be moved to other code, a commit can't.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install MkDocs Material
        run: pip install mkdocs-material==9.8.2

      # strict (also set in mkdocs.yml): a broken link or a page missing from nav fails the build.
      - name: Build
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
